name: ${COMPOSE_PROJECT_NAME:-wp}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &restart
  restart: unless-stopped

# wp-config defines. The official image evaluates WORDPRESS_CONFIG_EXTRA from the *environment of the
# running process*, so every container that boots WordPress (php-fpm, cron, wp-cli) needs the same block,
# or the object cache silently falls back to 127.0.0.1 and WP_HOME to the request host.
x-wp-config: &wp_config_extra |
  define('WP_REDIS_HOST', 'redis');
  define('WP_REDIS_PORT', 6379);
  define('WP_REDIS_PREFIX', '${COMPOSE_PROJECT_NAME:-wp}:');
  define('WP_CACHE', true);
  define('WP_HOME', 'https://${SITE_HOST}');
  define('WP_SITEURL', 'https://${SITE_HOST}');
  define('FORCE_SSL_ADMIN', true);
  define('DISALLOW_FILE_EDIT', true);
  define('WP_AUTO_UPDATE_CORE', 'minor');
  define('WP_MEMORY_LIMIT', '256M');
  define('WP_MAX_MEMORY_LIMIT', '512M');
  define('DISABLE_WP_CRON', true);
  if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }

services:
  # ---------------------------------------------------------------- edge ---
  # Caddy terminates TLS (Let's Encrypt, automatic renewal) and proxies to
  # nginx. Keeping nginx separate lets you tune caching without touching TLS,
  # and swap Caddy for a load balancer or Cloudflare tunnel in front.
  caddy:
    image: caddy:2-alpine
    <<: [*restart]
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------------- nginx ---
  nginx:
    image: nginx:1.27-alpine
    <<: [*restart]
    logging: *logging
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - wp_data:/var/www/html:ro
      - fastcgi_cache:/var/cache/nginx
    depends_on:
      php:
        condition: service_healthy
    networks: [edge, app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------- php ---
  php:
    build:
      context: ./php
      args:
        WORDPRESS_TAG: ${WORDPRESS_TAG:-php8.3-fpm-alpine}
    <<: [*restart]
    logging: *logging
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_TABLE_PREFIX: ${DB_PREFIX:-wp_}
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
    secrets: [db_password]
    volumes:
      - wp_data:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-prod.ini:ro
      - ./php/www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app, data]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # WP-Cron driven by the host clock, not by visitor traffic.
  cron:
    build:
      context: ./php
      args:
        WORDPRESS_TAG: ${WORDPRESS_TAG:-php8.3-fpm-alpine}
    <<: [*restart]
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do wp cron event run --due-now --path=/var/www/html --allow-root >/dev/null 2>&1; sleep 60; done"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
    secrets: [db_password]
    volumes:
      - wp_data:/var/www/html
    depends_on:
      php:
        condition: service_healthy
    networks: [app, data]

  # ------------------------------------------------------------------ db ---
  db:
    image: mariadb:11.4
    <<: [*restart]
    logging: *logging
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_AUTO_UPGRADE: "1"
    secrets: [db_password, db_root_password]
    volumes:
      - db_data:/var/lib/mysql
      - ./mariadb/my.cnf:/etc/mysql/conf.d/zz-prod.cnf:ro
    networks: [data]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------- redis ---
  redis:
    image: redis:7-alpine
    <<: [*restart]
    logging: *logging
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------- backup ---
  # Nightly encrypted dump + uploads archive to any S3-compatible bucket.
  backup:
    build: ./backup
    <<: [*restart]
    logging: *logging
    environment:
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-3}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-wordpress}
      DB_USER: ${DB_USER:-wordpress}
      DB_PASSWORD_FILE: /run/secrets/db_password
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
    secrets: [db_password, backup_passphrase]
    volumes:
      - wp_data:/var/www/html:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [data]

  # -------------------------------------------------------------- wp-cli ---
  # One-off tool: `docker compose run --rm wp plugin list`
  wp:
    image: wordpress:cli-2-php8.3
    profiles: [tools]
    # Alpine images: www-data is uid/gid 82 (not 33 as on Debian). Must match the php
    # service, which owns /var/www/html, or wp-cli cannot write wp-content.
    user: "82:82"
    # The image's entrypoint execs its arguments as-is, so prefix `wp`:
    # `docker compose run --rm wp core install …` then works as expected.
    entrypoint: ["docker-entrypoint.sh", "wp"]
    environment:
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
    secrets: [db_password]
    volumes:
      - wp_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      # php copies WordPress into the volume on first start; wait for it or wp-cli races the copy.
      php:
        condition: service_healthy
    # edge too: wp-cli must reach wordpress.org to install plugins (app and data are internal).
    networks: [edge, app, data]

secrets:
  db_password:
    file: ./secrets/db_password
  db_root_password:
    file: ./secrets/db_root_password
  backup_passphrase:
    file: ./secrets/backup_passphrase

volumes:
  wp_data:
  db_data:
  caddy_data:
  caddy_config:
  fastcgi_cache:
  backups:

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
