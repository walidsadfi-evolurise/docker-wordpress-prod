[www]
; Dynamic pool sized for ~2 vCPU / 4 GB; scale pm.max_children with RAM:
; (RAM available for PHP) / (average worker RSS, ~60-90 MB for WooCommerce).
pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.process_idle_timeout = 10s

pm.status_path = /status
ping.path = /ping

request_terminate_timeout = 120s
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
