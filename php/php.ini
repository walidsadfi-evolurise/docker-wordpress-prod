; Production overrides for the official WordPress image.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_vars = 3000
date.timezone = UTC

; Opcache sized for a plugin-heavy WooCommerce install.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.jit = 1255
opcache.jit_buffer_size = 64M

; Sessions in Redis would need the plugin; keep files but out of the web root.
session.save_path = /tmp
realpath_cache_size = 4096k
realpath_cache_ttl = 600
