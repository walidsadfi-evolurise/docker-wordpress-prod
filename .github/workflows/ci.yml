name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dummy secrets and env
        run: |
          cp .env.example .env
          mkdir -p secrets && for s in db_password db_root_password backup_passphrase; do echo "ci-$s" > secrets/$s; done
      - run: docker compose -f compose.yml -f compose.ci.yml config -q
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
      - name: nginx syntax
        run: |
          docker run --rm -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            --add-host php:127.0.0.1 nginx:1.27-alpine nginx -t

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i 's/^SITE_HOST=.*/SITE_HOST=localhost:8080/' .env
          mkdir -p secrets && for s in db_password db_root_password backup_passphrase; do echo "ci-$s" > secrets/$s; done
      - name: Boot the stack
        run: docker compose -f compose.yml -f compose.ci.yml up -d --build --wait --wait-timeout 300
      - name: Install WordPress + WooCommerce + Redis object cache
        run: |
          docker compose -f compose.yml -f compose.ci.yml run --rm wp core install \
            --url=http://localhost:8080 --title="CI Shop" --admin_user=admin \
            --admin_password=ci-password --admin_email=ci@example.com --skip-email
          docker compose -f compose.yml -f compose.ci.yml run --rm wp rewrite structure '/%postname%/'
          docker compose -f compose.yml -f compose.ci.yml run --rm wp plugin install woocommerce redis-cache --activate
          docker compose -f compose.yml -f compose.ci.yml run --rm wp redis enable
          docker compose -f compose.yml -f compose.ci.yml run --rm wp wc product create --name="CI Kettle" --regular_price=19.99 --sku=CI-0001 --user=admin
      - name: Smoke tests
        run: |
          set -eux
          curl -fsS http://localhost:8080/nginx-health
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/ | grep -q 200
          # First anonymous hit fills the cache, the second must be served from it.
          curl -s -D - -o /dev/null http://localhost:8080/ | grep -i x-cache
          curl -s -D - -o /dev/null http://localhost:8080/ | grep -i 'x-cache: HIT'
          # Store API is live, never cached, and sees the product.
          curl -s -D - http://localhost:8080/wp-json/wc/store/v1/products | tee /tmp/store.txt | grep -i 'x-cache' && exit 1 || true
          grep -q 'CI-0001' /tmp/store.txt
          # Security headers present, PHP version hidden.
          curl -s -D - -o /dev/null http://localhost:8080/ | grep -i 'strict-transport-security'
          curl -s -D - -o /dev/null http://localhost:8080/ | grep -i 'x-powered-by' && exit 1 || true
          # Redis object cache is active.
          docker compose -f compose.yml -f compose.ci.yml run --rm wp redis status | grep -i 'Status: Connected'
          # Backup script runs end to end (local only).
          docker compose -f compose.yml -f compose.ci.yml run --rm --no-deps -T backup /usr/local/bin/backup.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.ci.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f compose.yml -f compose.ci.yml down -v
