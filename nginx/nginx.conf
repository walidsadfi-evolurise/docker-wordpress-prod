user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main escape=json '{"time":"$time_iso8601","remote":"$http_x_real_ip",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time",'
        '"cache":"$upstream_cache_status","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    server_tokens       off;
    client_max_body_size 64m;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml font/woff2;

    # FastCGI page cache for anonymous traffic. Keyed on scheme+host+uri;
    # bypassed for logged-in users, carts, checkout and the REST/API paths.
    fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=WORDPRESS:100m
                       max_size=2g inactive=12h use_temp_path=off;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_503;
    fastcgi_cache_background_update on;
    fastcgi_cache_lock on;
    fastcgi_ignore_headers Cache-Control Expires Set-Cookie;

    # Rate limits: generous for pages, strict for login/xmlrpc.
    limit_req_zone $binary_remote_addr zone=pages:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    # Real client IP comes from Caddy on the edge network.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    upstream php {
        server php:9000;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
