# Decide per request whether the FastCGI cache may be used.
set $skip_cache 0;
if ($request_method = POST) { set $skip_cache 1; }
if ($query_string != "") { set $skip_cache 1; }
if ($request_uri ~* "/wp-admin/|/wp-login\.php|/cart/|/checkout/|/my-account/|/addons/|sitemap(_index)?\.xml|/feed/") { set $skip_cache 1; }
if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session") { set $skip_cache 1; }

# HTTPS flag for PHP when TLS terminates upstream.
set $https_flag "";
if ($http_x_forwarded_proto = "https") { set $https_flag "on"; }
