server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/cache-bypass.conf;

    location = /nginx-health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    # Static assets: long cache, no PHP.
    location ~* \.(?:css|js|mjs|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Block direct access to sensitive files.
    location ~* /(?:wp-config\.php|readme\.html|license\.txt|xmlrpc\.php|\.env|\.git) { return 404; }
    location ~* /(?:uploads|files)/.*\.php$ { return 404; }
    location ~ /\. { deny all; }

    # Brute-force surface.
    location = /wp-login.php {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_cache_bypass 1;
        fastcgi_no_cache 1;
    }

    # REST API and AJAX: never cached by nginx (agents and the Store API need live data).
    # Handed straight to index.php: a try_files fallback would re-enter `location ~ \.php$`
    # and pick up its cache. Needs pretty permalinks (wp rewrite structure '/%postname%/').
    location ^~ /wp-json/ {
        limit_req zone=pages burst=60 nodelay;
        include /etc/nginx/snippets/fastcgi-php-pass.conf;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /wp-admin/admin-ajax.php {
        limit_req zone=pages burst=60 nodelay;
        include /etc/nginx/snippets/fastcgi-php.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        limit_req zone=pages burst=60 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 301 302 10m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
